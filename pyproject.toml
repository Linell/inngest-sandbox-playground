[project]
name = "inngest-sandbox-playground"
version = "0.1.0"
description = "Per-user coding agent on Inngest Sandboxes, with each user's work kept on a git branch"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.3.0",
    "flask>=3.1.3",
    "inngest",
]

[tool.uv.sources]
inngest = { path = "../inngest-py/pkg/inngest", editable = true }

[tool.pyright]
venvPath = "."
venv = ".venv"
